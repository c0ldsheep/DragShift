# The website (site/): tests it, then publishes it with GitHub Pages.
# One-time: repo Settings → Pages → Source: "GitHub Actions".
# Every action is pinned to an exact commit (the comment says which release): a moved or hijacked tag
# can't change what runs here. To update, look up the new release's commit and change both.
name: Website

on:
  push:
    branches: [main, master]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tests
        run: node --test site/tests/*.test.js
      # Only what visitors need (no tests, no notes), with every script and style address stamped with this
      # version, so a browser can never run half an old version and half a new one (site/tools/stamp.mjs).
      - name: Stamp and copy the site
        run: node site/tools/stamp.mjs site _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
